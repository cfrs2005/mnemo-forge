[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mnemo-forge"
version = "0.1.0"
description = "A small, auditable MnemoForge POC for PostgreSQL and pgvector"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Toy" }]
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.7",
  "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]
